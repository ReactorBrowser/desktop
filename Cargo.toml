[package]
name = "reactor-browser"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.41"
diesel = { version = "2.2.12", features = [
    "sqlite",
    "returning_clauses_for_sqlite_3_35",
    "chrono",
] }
libsqlite3-sys = { version = "*", features = ["bundled"] }
diesel_migrations = "2.3.1"
dotenvy = "0.15.7"
iced = "0.14"
iced_wry = "0.1.0"
wry = "*"
serde = "1.0.229"
serde_json = "1.0.151"
anyhow = "1.0.104"
directories = "6.0.0"
